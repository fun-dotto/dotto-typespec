[settings]
minimum_release_age = "7d"

[tools]
node = "24.16.0"
pnpm = "11.5.2"

[tasks.setup]
description = "Install dependencies"
run = "pnpm install"

[tasks.compile]
description = "Compile TypeSpec to OpenAPI schema"
run = "pnpm compile"

[tasks.watch]
description = "Watch for changes and compile"
run = "pnpm watch"

[tasks.format]
description = "Format the code"
run = "pnpm format"

[tasks.preview]
description = "Preview the documentation"
run = "pnpm preview"

[tasks.watch-and-preview]
description = "Watch for changes and preview the documentation"
depends = ["watch", "preview"]

[tasks.clean]
run = "rm -rf ./tsp-output/schema"
