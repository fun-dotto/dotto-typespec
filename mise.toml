[settings]
minimum_release_age = "7d"

[tools]
node = "24.16.0"
pnpm = "11.5.2"

[tasks.setup]
description = "Install dependencies"
run = "pnpm install"

[tasks.compile]
description = "Compile TypeSpec to OpenAPI schema"
run = "pnpm compile"

[tasks.watch]
description = "Watch for changes and compile"
run = "pnpm watch"

[tasks.format]
description = "Format the code"
run = "pnpm format"

[tasks.preview]
description = "Preview the documentation"
run = "pnpm preview"

[tasks.watch-and-preview]
description = "Watch for changes and preview the documentation"
depends = ["watch", "preview"]

[tasks.build]
description = "Clean and build the documentation"
run = [
  "mise run clean",
  "mise run compile-and-build-docs",
]

[tasks.compile-and-build-docs]
run = [
  "mise run compile",
  "mise run build-docs",
]

[tasks.build-docs]
depends = [
  "build-docs:academic-api",
  "build-docs:admin-bff-api",
  "build-docs:app-bff-api",
  "build-docs:announcement-api",
  "build-docs:funch-api",
  "build-docs:user-api",
]

[tasks."build-docs:academic-api"]
run = "pnpm build-docs:academic-api"

[tasks."build-docs:admin-bff-api"]
run = "pnpm build-docs:admin-bff-api"

[tasks."build-docs:app-bff-api"]
run = "pnpm build-docs:app-bff-api"

[tasks."build-docs:announcement-api"]
run = "pnpm build-docs:announcement-api"

[tasks."build-docs:funch-api"]
run = "pnpm build-docs:funch-api"

[tasks."build-docs:user-api"]
run = "pnpm build-docs:user-api"

[tasks.clean]
description = "Clean the schema and documentation"
depends = ["clean-schema", "clean-docs"]

[tasks.clean-schema]
run = "rm -rf ./tsp-output/schema"

[tasks.clean-docs]
run = "rm -rf ./dist"
