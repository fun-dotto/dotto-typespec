name: Verify task compile

on:
  pull_request:
    paths:
      - "src/**"
      - "main.tsp"
      - "tspconfig.yaml"
      - "Taskfile.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "mise.toml"
      - ".github/workflows/compile-check.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "main.tsp"
      - "tspconfig.yaml"
      - "Taskfile.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "mise.toml"
      - ".github/workflows/compile-check.yml"
  workflow_dispatch:

concurrency:
  group: compile-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Install dependencies
        run: task install
      - name: Verify compile
        run: task compile
