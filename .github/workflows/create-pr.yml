name: Create PR on Schema Change

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "main.tsp"
      - "tspconfig.yaml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - name: Install
        run: task install
      - name: Compile
        run: task compile
      - uses: actions/upload-artifact@v4
        with:
          name: schemas
          path: tsp-output/schema/

  create-pr:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: dotto-flutter
            type: bff
            schema: openapi.AppBFFService.yaml
          - repo: app-bff-api
            type: bff
            schema: openapi.AppBFFService.yaml
          - repo: dotto-admin-web
            type: bff
            schema: openapi.AdminBFFService.yaml
          - repo: admin-bff-api
            type: bff
            schema: openapi.AdminBFFService.yaml
          - repo: announcement-api
            type: backend
            schema: openapi.AnnouncementService.yaml
          - repo: subject-api
            type: backend
            schema: openapi.SubjectService.yaml
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.DOTTO_API_SCHEMA_UPDATER_APP_ID }}
          private-key: ${{ secrets.DOTTO_API_SCHEMA_UPDATER_APP_PRIVATE_KEY }}
          owner: fun-dotto
          repositories: ${{ matrix.repo }}
      - uses: actions/download-artifact@v4
        with:
          name: schemas
          path: schemas
      - name: Check if branch exists
        id: check-branch
        run: |
          if git ls-remote --exit-code --heads https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/fun-dotto/${{ matrix.repo }}.git update-openapi-schema; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v6
        with:
          repository: fun-dotto/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo
          ref: ${{ steps.check-branch.outputs.exists == 'true' && 'update-openapi-schema' || '' }}
          fetch-depth: 0
      - name: Copy schemas
        run: |
          mkdir -p target-repo/openapi
          cp schemas/${{ matrix.schema }} target-repo/openapi/openapi.yaml

          if [ "${{ matrix.type }}" = "bff" ]; then
            mkdir -p target-repo/openapi/external/announcement_api
            mkdir -p target-repo/openapi/external/subject_api
            cp schemas/openapi.AnnouncementService.yaml target-repo/openapi/external/announcement_api/openapi.yaml
            cp schemas/openapi.SubjectService.yaml target-repo/openapi/external/subject_api/openapi.yaml
          fi
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo
          branch: update-openapi-schema
          title: "Update OpenAPI schema"
          body: |
            This PR updates the OpenAPI schema from [dotto-typespec](https://github.com/fun-dotto/dotto-typespec).

            Triggered by: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          commit-message: "Update OpenAPI schema from dotto-typespec"
