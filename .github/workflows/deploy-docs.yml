name: Deploy Documents

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ github.token }}
          cache: true
      - name: Setup
        run: mise setup
      - name: Build
        run: mise run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"
      - id: deployment
        uses: actions/deploy-pages@v4
